<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>3D Earth Open World</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
window.onload = () => {
    const canvas = document.getElementById("gameCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    async function createScene() {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color3(0.6, 0.8, 1.0);
        const camera = new BABYLON.FollowCamera("FollowCam", new BABYLON.Vector3(0, 5, -10), scene);
        camera.radius = 10;
        camera.heightOffset = 4;
        camera.rotationOffset = 180;
        camera.cameraAcceleration = 0.05;
        camera.maxCameraSpeed = 20;
        camera.attachControl(canvas, true);

        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 200, height: 200 }, scene);
        const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
        groundMat.diffuseTexture = new BABYLON.Texture("https://assets.babylonjs.com/environments/earth.jpg", scene);
        ground.material = groundMat;

        // Load human character model
        const result = await BABYLON.SceneLoader.ImportMeshAsync(
            "",
            "https://assets.babylonjs.com/meshes/",
            "dummy3.babylon",
            scene
        );

        const player = result.meshes[0];
        player.scaling = new BABYLON.Vector3(0.5, 0.5, 0.5);
        player.position = new BABYLON.Vector3(0, 0, 0);
        camera.lockedTarget = player;

        const inputMap = {};
        scene.actionManager = new BABYLON.ActionManager(scene);
        scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, evt => {
            inputMap[evt.sourceEvent.key.toLowerCase()] = true;
        }));
        scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, evt => {
            inputMap[evt.sourceEvent.key.toLowerCase()] = false;
        }));

        scene.onBeforeRenderObservable.add(() => {
            if (inputMap["w"] || inputMap["arrowup"]) player.position.z += 0.2;
            if (inputMap["s"] || inputMap["arrowdown"]) player.position.z -= 0.2;
            if (inputMap["a"] || inputMap["arrowleft"]) player.position.x -= 0.2;
            if (inputMap["d"] || inputMap["arrowright"]) player.position.x += 0.2;
        });

        return scene;
    }

    createScene().then(scene => {
        engine.runRenderLoop(() => scene.render());
    });

    window.addEventListener("resize", () => engine.resize());
};
</script>
</body>
</html>
